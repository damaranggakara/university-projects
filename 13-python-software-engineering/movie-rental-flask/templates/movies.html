{% extends 'base.html' %}

{% block title %}Movies - Movie Borrowing{% endblock %}

{% block content %}
    <h2>Available Movies</h2>
    <table class="movie-table">
        <thead>
            <tr>
                <th>Title</th>
                <th>Genre</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody>
            {% for movie in movies %}
            <tr>
                <td>{{ movie.title }}</td>
                <td>{{ movie.genre }}</td>
                <td>{{ movie.year }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
