name: checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    # The warehouse projects verify themselves against a real database rather
    # than a mock, so CI runs one.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_only_not_a_secret

    steps:
      - uses: actions/checkout@v4

      # 3.12, not the latest: two projects depend on TensorFlow and
      # stable-baselines3, which have no release supporting 3.13+.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # union of the per-project requirements the checks actually need
          pip install \
            "pandas>=2.0" "numpy>=1.24" "scipy>=1.11" "scikit-learn>=1.3,<1.11" \
            "openpyxl>=3.1" "sqlalchemy>=2.0" "psycopg2-binary>=2.9" \
            "matplotlib>=3.7" "seaborn>=0.13" "minisom>=2.3" "flask>=3.0" \
            "opencv-python-headless>=4.8" "pillow>=10.0" "legacy-cgi>=2.6" \
            "lightgbm>=4.0" "xgboost>=2.0" "nltk>=3.8" "vaderSentiment>=3.3" \
            "pyspellchecker>=0.8" "wordcloud>=1.9" "tweepy>=4.14" \
            "pymongo>=4.6" "mysql-connector-python>=8.0"

      - name: NLTK corpora
        run: |
          python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt_tab')"

      - name: Run all checks
        run: python run_checks.py

      - name: Verify notebooks are valid and carry saved outputs
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          bad, no_out = [], []
          for f in sorted(Path(".").rglob("*.ipynb")):
              if ".ipynb_checkpoints" in str(f):
                  continue
              try:
                  nb = json.loads(f.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append((f, e)); continue
              code = [c for c in nb.get("cells", []) if c.get("cell_type") == "code"]
              if code and not any(c.get("outputs") for c in code):
                  no_out.append(f)
          for f, e in bad:
              print(f"INVALID  {f}: {e}")
          for f in no_out:
              print(f"NO OUTPUT {f}")
          print(f"checked notebooks: bad={len(bad)} without-output={len(no_out)}")
          sys.exit(1 if bad else 0)
          PY

      - name: Check no credentials or local paths were committed
        # same script that runs locally, so a false positive is caught before CI
        run: python scan_secrets.py
